name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt pytest-github-actions-annotate-failures
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name naverblogbot --collect-all imageio_ffmpeg run.py
      - uses: actions/upload-artifact@v4
        with:
          name: naverblogbot
          path: dist/naverblogbot.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/naverblogbot.exe
